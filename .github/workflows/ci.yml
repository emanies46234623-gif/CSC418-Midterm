
name: Assignment Portal CI and JSON Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-tests:
    name: Run Tests and Send JSON Report
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests and deliver report
        env:
          REPORT_URL: http://127.0.0.1:4000/report
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: node run-tests.js
